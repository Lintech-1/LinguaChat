# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# unified Fabric Loom version for both remap (<=1.21.11) and unobfuscated (>=26.1) branches
loomx.loom_version=1.18.4
# one-shot Gradle process: dies after every build instead of lingering in RAM
# (trade-off: each build pays a few seconds of JVM startup; drop this line if speed matters more)
org.gradle.daemon=false
