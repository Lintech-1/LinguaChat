plugins {
    id 'fabric-loom' version '1.14+'
    id 'dev.kikugie.stonecutter'
    id 'maven-publish'
}

version = '2.0.0'
group = 'com.linguachat'

// Configure JAR naming with Minecraft version
base.archivesName = "linguachat-${sc.current.version}"

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.quiltmc.org/repository/release' }
    maven { url 'https://maven.quiltmc.org/repository/snapshot' }
    maven { url 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/' }
    maven { url 'https://modmaven.dev/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    // Version-specific dependencies using Stonecutter conditions
    minecraft "com.mojang:minecraft:${sc.current.version}"
    
    // Yarn mappings based on Minecraft version
    if (sc.current.parsed >= "1.21.11") {
        mappings "net.fabricmc:yarn:1.21.11+build.1:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.139.5+1.21.11"
    } else if (sc.current.parsed >= "1.21.5") {
        mappings "net.fabricmc:yarn:1.21.5+build.1:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.122.0+1.21.5"
    } else if (sc.current.parsed >= "1.21.1") {
        mappings "net.fabricmc:yarn:${sc.current.version}+build.${sc.current.version == '1.21.4' ? '1' : '3'}:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${sc.current.version == '1.21.4' ? '0.99.5+1.21' : '0.102.0+1.21.1'}"
    } else if (sc.current.parsed >= "1.20.1") {
        mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"
    } else if (sc.current.parsed >= "1.19.2") {
        mappings "net.fabricmc:yarn:1.19.2+build.28:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.76.1+1.19.2"
    } else if (sc.current.parsed >= "1.18.2") {
        mappings "net.fabricmc:yarn:1.18.2+build.4:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.76.0+1.18.2"
    } else {
        mappings "net.fabricmc:yarn:1.16.5+build.10:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.42.0+1.16"
    }
    
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    
    // Mod Menu for GUI settings - versions depend on Minecraft version
    if (sc.current.parsed >= "1.21.11") {
        modImplementation "com.terraformersmc:modmenu:17.0.0-beta.2"
    } else if (sc.current.parsed >= "1.21.5") {
        modImplementation "com.terraformersmc:modmenu:12.0.0"
    } else if (sc.current.parsed >= "1.21.4") {
        modImplementation "com.terraformersmc:modmenu:12.0.0-beta.1"
    } else if (sc.current.parsed >= "1.21.1") {
        modImplementation "com.terraformersmc:modmenu:11.0.1"
    } else if (sc.current.parsed >= "1.20.1") {
        modImplementation "com.terraformersmc:modmenu:7.2.0"
    } else if (sc.current.parsed >= "1.19.2") {
        modImplementation "com.terraformersmc:modmenu:4.1.2"
    } else if (sc.current.parsed >= "1.18.2") {
        modImplementation "com.terraformersmc:modmenu:3.2.2"
    } else {
        modImplementation "com.terraformersmc:modmenu:1.16.23"
    }
    
    // DeepL API Client
    include 'com.deepl.api:deepl-java:1.9.0'
    implementation 'com.deepl.api:deepl-java:1.9.0'
    
    // JSON handling
    include 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'net.jqwik:jqwik:1.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft", stonecutter.current.version
    filteringCharset "UTF-8"

    // Determine required Java version based on Minecraft version
    def javaVersion = sc.current.parsed >= "1.21" ? "21" : (sc.current.parsed >= "1.18" ? "17" : "8")
    def mixinJavaLevel = sc.current.parsed >= "1.21" ? "JAVA_21" : (sc.current.parsed >= "1.18" ? "JAVA_17" : "JAVA_8")
    
    // Determine Fabric API version based on Minecraft version
    def fabricApiVersion
    def fabricApiModId
    if (sc.current.parsed >= "1.21.4") {
        fabricApiVersion = "0.99.5+1.21"
        fabricApiModId = "fabric-api"
    } else if (sc.current.parsed >= "1.21.1") {
        fabricApiVersion = "0.102.0+1.21.1"
        fabricApiModId = "fabric-api"
    } else if (sc.current.parsed >= "1.20.1") {
        fabricApiVersion = "0.92.2+1.20.1"
        fabricApiModId = "fabric-api"
    } else if (sc.current.parsed >= "1.19.2") {
        fabricApiVersion = "0.76.1+1.19.2"
        fabricApiModId = "fabric-api"
    } else if (sc.current.parsed >= "1.18.2") {
        fabricApiVersion = "0.76.0+1.18.2"
        fabricApiModId = "fabric"
    } else {
        fabricApiVersion = "0.42.0+1.16"
        fabricApiModId = "fabric"
    }
    
    // Determine if MessageHandlerMixin is needed (only for 1.19+)
    def messageHandlerMixin = sc.current.parsed >= "1.19" ? ',\n    "client.MessageHandlerMixin"' : ''

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": stonecutter.current.version,
            "loader_version": "0.16.10",
            "java_version": javaVersion,
            "fabric_api_version": fabricApiVersion,
            "fabric_api_mod_id": fabricApiModId
        )
    }
    
    filesMatching("linguachat.mixins.json") {
        expand(
            "mixin_java_level": mixinJavaLevel,
            "message_handler_mixin": messageHandlerMixin
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    
    // Exclude MessageHandlerMixin for versions < 1.19
    if (sc.current.parsed < "1.19") {
        exclude '**/MessageHandlerMixin.java'
    }
}

// Configure test task
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

// Configure Java toolchain
java {
    // Use Java 8 for 1.16.5, Java 17 for 1.18-1.20, Java 21 for 1.21+
    def javaVersion = sc.current.parsed >= "1.21" ? 21 : (sc.current.parsed >= "1.18" ? 17 : 8)
    
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
} 