name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2.0.0, v2.1.0, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build All Versions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      
      - name: Build All Versions
        run: ./gradlew build
      
      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          # Collect all .jar files from all version directories
          find versions/*/build/libs -name "*.jar" -type f -exec cp {} artifacts/ \;
          
          # List collected artifacts
          echo "Collected artifacts:"
          ls -lh artifacts/
      
      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum *.jar > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
          retention-days: 7

  release:
    name: Create Release (Manual Approval Required)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production  # This environment requires manual approval
    
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
      
      - name: Display Artifacts
        run: |
          echo "Artifacts ready for release:"
          ls -lh artifacts/
          echo ""
          echo "Checksums:"
          cat artifacts/checksums.txt
      
      - name: Extract Version from Tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "LinguaChat ${{ steps.version.outputs.version }}" \
            --generate-notes \
            artifacts/*.jar \
            artifacts/checksums.txt
      
      - name: Release Summary
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!"
          echo "📦 Uploaded artifacts:"
          ls -1 artifacts/*.jar | wc -l | xargs echo "  - JAR files:"
          echo "  - Checksums: checksums.txt"
