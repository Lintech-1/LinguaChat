name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2.0.0, v2.1.0, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build All Versions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      
      - name: Build All Versions
        run: ./gradlew build
      
      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          # Collect all .jar files from all version directories
          find versions/*/build/libs -name "*.jar" -type f -exec cp {} artifacts/ \;
          
          # List collected artifacts
          echo "Collected artifacts:"
          ls -lh artifacts/
      
      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum *.jar > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
          retention-days: 7

  release:
    # One publish per MC version (like Sodium/ModMenu do): launchers download the PRIMARY
    # file of a release, so every MC version needs its own release entry with its own jar,
    # game version and Java requirement - otherwise everyone gets the 1.16.5 jar.
    name: Publish to Modrinth for ${{ matrix.mc }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production  # This environment requires manual approval
    strategy:
      matrix:
        include:
          - { mc: 1.16.5,  java: 8 }
          - { mc: 1.18.2,  java: 17 }
          - { mc: 1.19.2,  java: 17 }
          - { mc: 1.20.1,  java: 17 }
          - { mc: 1.21.1,  java: 21 }
          - { mc: 1.21.4,  java: 21 }
          - { mc: 1.21.5,  java: 21 }
          - { mc: 1.21.11, java: 21 }
          - { mc: 26.3,    java: 25 }
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
      
      - name: Display Artifacts
        run: |
          echo "Artifacts ready for release:"
          ls -lh artifacts/
          echo ""
          echo "Checksums:"
          cat artifacts/checksums.txt
      
      - name: Extract Version from Tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Extract changelog section
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk -v ver="$VERSION" '
            /^## / { if ($0 != "## " ver) p=0 }
            $0 == "## " ver { p=1 }
            p
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md: no section '## $VERSION'. Add it before tagging."
            exit 1
          fi
          echo "--- release notes ---"
          cat release_notes.md
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # idempotent: re-runs of the workflow won't fail on an existing release
          gh release view ${{ github.ref_name }} --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "LinguaChat ${{ steps.version.outputs.version }}" \
              --notes-file release_notes.md \
              --generate-notes \
              artifacts/*.jar \
              artifacts/checksums.txt

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: linguachat
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # exactly one jar per matrix entry; Modrinth version number gets the MC suffix (3.0.0+1.21.11)
          files: artifacts/linguachat-${{ matrix.mc }}-${{ steps.version.outputs.version }}.jar
          game-versions: ${{ matrix.mc }}
          java: ${{ matrix.java }}
          name: LinguaChat ${{ steps.version.outputs.version }} for ${{ matrix.mc }}
          version: ${{ steps.version.outputs.version }}+${{ matrix.mc }}
          version-type: release
          changelog-file: release_notes.md
          loaders: fabric
          # the unfeature step hits a broken Modrinth v3 route (401) - featured flags are managed manually
          modrinth-unfeature-mode: none

      - name: Release Summary
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!"
          ls -1 artifacts/*.jar | wc -l | xargs echo "  - JAR files published:

  curseforge-release:
    # CurseForge: ONE release entry with all jars (per-file game versions are not supported
    # by mc-publish) - after publishing, manually fix each file's game versions on the site
    name: Publish to CurseForge
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production  # This environment requires manual approval

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/

      - name: Extract Version from Tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk -v ver="$VERSION" '
            /^## / { if ($0 != "## " ver) p=0 }
            $0 == "## " ver { p=1 }
            p
          ' CHANGELOG.md > release_notes.md

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: linguachat
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: "artifacts/!(*-sources).jar"
          game-versions: |
            1.16.5
            1.18.2
            1.19.2
            1.20.1
            1.21.1
            1.21.4
            1.21.5
            1.21.11
            26.3
          java: |
            8
            17
            21
            25
          name: LinguaChat ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: release_notes.md
          loaders: fabric
