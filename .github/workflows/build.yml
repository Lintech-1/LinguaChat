name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      
      - name: Build All Versions
        run: ./gradlew build
      
      - name: List Build Artifacts
        run: |
          echo "Build completed successfully!"
          echo ""
          echo "Generated artifacts:"
          find versions/*/build/libs -name "*.jar" -type f -exec ls -lh {} \;
      
      - name: Upload Build Artifacts (for inspection)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-artifacts
          path: versions/*/build/libs/*.jar
          retention-days: 3
